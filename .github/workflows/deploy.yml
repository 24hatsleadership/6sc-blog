name: Build and deploy site
on:
  push:
    branches: [main]
  schedule:
    # Tuesday 16:45 UTC.
    # 12:45 PM Eastern Daylight Time, and 11:45 AM Eastern Standard Time.
    # Always after 11:30 AM America/New_York, so a post dated that Tuesday
    # is already eligible when the date gate runs.
    - cron: "45 16 * * 2"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
